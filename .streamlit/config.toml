[theme]
primaryColor = "#008A71"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F3F4F6"
textColor = "#332F22"
font = "sans serif"

[server]
headless = true
# IMPORTANT: do NOT set server.address / server.port here. Streamlit
# Community Cloud manages its own port and reverse-proxy binding, and a
# hardcoded custom port in this file breaks the Cloud deployment outright
# ("Oh no. Error running app.") — this is what happened when 8502 was
# added here. For self-hosted/Tailscale deployment, deploy\start.ps1
# already passes --server.address=0.0.0.0 --server.port=8502 explicitly
# on the command line, which overrides this file — no config.toml change
# is needed or safe for that. See DEPLOYMENT.md.

[browser]
gatherUsageStats = false
